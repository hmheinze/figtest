<style>
body{margin:0}
.wrap{display:grid;grid-template-columns:repeat(2,1fr);background:#1a1814;gap:2px}
.cell{display:flex;flex-direction:column;align-items:center;padding:16px 8px 12px;gap:8px}
canvas{display:block}
.lbl{font-family:var(--font-sans,'sans-serif');font-size:9px;letter-spacing:0.13em;color:#444;text-transform:uppercase;text-align:center}
</style>
<div class="wrap">
  <div class="cell"><canvas id="a" width="210" height="210"></canvas><div class="lbl">01 — unfurl</div></div>
  <div class="cell"><canvas id="b" width="210" height="210"></canvas><div class="lbl">02 — swell</div></div>
  <div class="cell"><canvas id="c" width="210" height="210"></canvas><div class="lbl">03 — twin</div></div>
  <div class="cell"><canvas id="d" width="210" height="210"></canvas><div class="lbl">04 — contract</div></div>
</div>
<script>
(function(){
const TAU=Math.PI*2;
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function eio(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

function sn(sx,sy,t){
  return( Math.sin(sx*1.4+t*0.9)*Math.cos(sy*1.1-t*0.7)
        + Math.sin(sx*2.8-t*1.2)*Math.cos(sy*2.2+t*0.5)*0.5
        + Math.sin(sx*5.1+t*0.4)*Math.cos(sy*4.6-t*1.0)*0.22
        + Math.sin(sx*0.7-t*0.3)*Math.cos(sy*0.8+t*0.5)*0.38
        )/2.1;
}

const AMBER=[210,165,90];
const SLATE=[85,115,148];
const BONE=[232,218,192];
const INK=[14,12,10];

function mc(c1,c2,t){
  t=clamp(t,0,1);
  return[Math.floor(lerp(c1[0],c2[0],t)),
         Math.floor(lerp(c1[1],c2[1],t)),
         Math.floor(lerp(c1[2],c2[2],t))];
}

// Nodes hold triangular structure — only global rotation + tiny breath
function getNodes(cx,cy,t,R){
  return[0,1,2].map(i=>{
    const base=TAU*i/3-Math.PI/2;
    const dr=sn(i*3.1,i*2.3,t*0.2)*5; // very small drift
    const a=base+t*0.018; // slow unified rotation
    return{x:cx+(R+dr)*Math.cos(a),y:cy+(R+dr)*Math.sin(a),a};
  });
}

// Core fold renderer — bilateral symmetry around each node's axis
// dotFn(frac, fade, pulse, breath) => [r,g,b,a,size]
// spread: angular half-width of fan
// steps: number of dot pairs per node
function renderFold(ctx,cx,cy,ns,t,spread,steps,dotFn,globalPhase){
  for(let i=0;i<3;i++){
    const n=ns[i];
    const axisAngle=Math.atan2(n.y-cy,n.x-cx);
    const breath=eio(0.5+0.5*Math.sin(t*0.65+i*TAU/3+(globalPhase||0)));

    for(let d=0;d<steps;d++){
      const frac=d/steps;
      // angle offset from axis — symmetric around it
      const halfSpread=spread*(0.5+0.5*breath);
      const angleOffset=lerp(-halfSpread,halfSpread,frac)
                       +sn(d*0.31+i,i*2.7,t*0.55)*0.18;

      const angle=axisAngle+angleOffset;
      const mirrorAngle=axisAngle-angleOffset;

      // radius: noise-modulated, symmetric
      const noiseMod=0.4+sn(frac*5.1+i*3.3,frac*4.7+i*2.1,t*0.5)*0.6;
      const pulse=0.5+0.5*Math.sin(t*0.9+frac*TAU+i*TAU/3);
      const [r,g,b,a,sz]=dotFn(frac,noiseMod,pulse,breath,i);

      if(a<=0||sz<=0)continue;

      const dr2=sz>0?(20+breath*30)*noiseMod*(0.5+pulse*0.5):0;

      const px=n.x+Math.cos(angle)*dr2;
      const py=n.y+Math.sin(angle)*dr2;
      const mx=n.x+Math.cos(mirrorAngle)*dr2;
      const my=n.y+Math.sin(mirrorAngle)*dr2;

      const col=`rgba(${r},${g},${b},${a})`;
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(px,py,sz,0,TAU);ctx.fill();
      ctx.beginPath();ctx.arc(mx,my,sz,0,TAU);ctx.fill();
    }
  }
}

// ---- 01: UNFURL ----
// The three arms slowly unfurl outward from their nodes —
// like feathers or wings opening. The symmetry is strict:
// each arm is perfectly mirrored. The breath is in the reach —
// dots extend far then draw back in, all three arms moving together.
// Colour: amber core bleeding to slate at the tips, ink spine.
;(function(){
  const cv=document.getElementById('a'),ctx=cv.getContext('2d');
  const W=210,H=210,cx=W/2,cy=H/2;
  let t=0;

  function draw(){
    ctx.fillStyle='rgba(14,12,10,0.11)';ctx.fillRect(0,0,W,H);
    t+=0.006;
    const ns=getNodes(cx,cy,t,58);
    const globalBreath=eio(0.5+0.5*Math.sin(t*0.5));

    for(let i=0;i<3;i++){
      const n=ns[i];
      const axisAngle=Math.atan2(n.y-cy,n.x-cx);
      const breath=eio(0.5+0.5*Math.sin(t*0.65+i*TAU/3));
      // ALL THREE breathe together — unified unfurl
      const unifiedBreath=eio(0.5+0.5*Math.sin(t*0.5));
      const spread=0.85;
      const STEPS=110;
      const maxR=14+unifiedBreath*38;

      for(let d=0;d<STEPS;d++){
        const frac=d/STEPS;
        const angleOffset=lerp(-spread,spread,frac)
                         +sn(d*0.28+i,i*3.1,t*0.5)*0.14;
        const angle=axisAngle+angleOffset;
        const mirrorAngle=axisAngle-angleOffset;

        // radial distance modulated by noise + centrality
        const centrality=1-Math.abs(frac*2-1);
        const nm=0.45+sn(frac*4.3+i,frac*3.7+i,t*0.45)*0.55;
        const pulse=0.5+0.5*Math.sin(t*0.85+frac*5.1+i*TAU/3);
        const dr=maxR*nm*(0.5+centrality*0.5);

        // colour: amber/bone at spine, slate at tips
        const c=centrality>0.5
          ? mc(mc(AMBER,BONE,1-centrality),INK,0.2+nm*0.2)
          : mc(SLATE,mc(INK,BONE,nm*0.4),(1-centrality)*0.7);
        const sz=clamp(0.4+centrality*2.4*pulse*(0.4+unifiedBreath*0.6),0.1,3.2);
        const alpha=clamp(centrality*0.7*pulse*(0.3+unifiedBreath*0.7),0,0.8);

        const col=`rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
        ctx.fillStyle=col;
        [[angle],[mirrorAngle]].forEach(([ang])=>{
          const px=n.x+Math.cos(ang)*dr;
          const py=n.y+Math.sin(ang)*dr;
          ctx.beginPath();ctx.arc(px,py,sz,0,TAU);ctx.fill();
        });
      }
    }
    requestAnimationFrame(draw);
  }
  ctx.fillStyle='#0e0c0a';ctx.fillRect(0,0,W,H);
  draw();
})();

// ---- 02: SWELL ----
// The three arms breathe OUT OF PHASE — while one swells the
// others contract. The breathing is the movement, nothing rotates.
// Each arm at full swell becomes a fat blotchy wing.
// At minimum it's a tight ink spine. The asymmetric breath
// creates constant compositional shift. Amber swell, ink contract.
;(function(){
  const cv=document.getElementById('b'),ctx=cv.getContext('2d');
  const W=210,H=210,cx=W/2,cy=H/2;
  let t=0;

  function draw(){
    ctx.fillStyle='rgba(14,12,10,0.10)';ctx.fillRect(0,0,W,H);
    t+=0.006;
    const ns=getNodes(cx,cy,t,57);

    for(let i=0;i<3;i++){
      const n=ns[i];
      const axisAngle=Math.atan2(n.y-cy,n.x-cx);
      // staggered phase — each arm on its own breath cycle
      const breath=eio(0.5+0.5*Math.sin(t*0.6+i*TAU/3));
      const spread=0.7+breath*0.5;
      const STEPS=120;
      const maxR=8+breath*42;

      for(let d=0;d<STEPS;d++){
        const frac=d/STEPS;
        const centrality=1-Math.abs(frac*2-1);
        const angleOffset=lerp(-spread,spread,frac)
                         +sn(frac*5.1+i,i*2.9+frac,t*0.55)*0.2;
        const angle=axisAngle+angleOffset;
        const mirrorAngle=axisAngle-angleOffset;

        const nm=0.4+sn(frac*4.7+i*2,frac*3.3+i,t*0.5)*0.6;
        const pulse=0.5+0.5*Math.sin(t*1.1+frac*4.3+i*TAU/3);
        const dr=maxR*nm*(0.4+centrality*0.6);

        // when swelling: amber/bone; when contracted: ink/slate
        const c=breath>0.5
          ? mc(mc(AMBER,BONE,centrality*0.7),INK,0.15+nm*0.2)
          : mc(mc(INK,SLATE,centrality*0.5),AMBER,breath*0.3);
        const sz=clamp(0.3+centrality*2.8*breath*(0.5+nm*0.5),0.1,3.5);
        const alpha=clamp(centrality*0.75*(0.2+breath*0.8)*pulse,0,0.85);

        const col=`rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
        ctx.fillStyle=col;
        [angle,mirrorAngle].forEach(ang=>{
          ctx.beginPath();ctx.arc(n.x+Math.cos(ang)*dr,n.y+Math.sin(ang)*dr,sz,0,TAU);ctx.fill();
        });
      }
    }
    requestAnimationFrame(draw);
  }
  ctx.fillStyle='#0e0c0a';ctx.fillRect(0,0,W,H);
  draw();
})();

// ---- 03: TWIN ----
// Each arm has TWO layers of symmetry — a dense inner wing
// and a sparse outer halo, both mirrored. The inner wing is
// amber/ink, the outer halo is cool slate/bone.
// They breathe at different rates — the inner contracts while
// the outer expands and vice versa, creating a pulsing layered depth.
;(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  const W=210,H=210,cx=W/2,cy=H/2;
  let t=0;

  function drawLayer(ctx,n,axisAngle,t,i,maxR,spread,STEPS,breathVal,colFn){
    for(let d=0;d<STEPS;d++){
      const frac=d/STEPS;
      const centrality=1-Math.abs(frac*2-1);
      const angleOffset=lerp(-spread,spread,frac)
                       +sn(frac*4.1+i*1.7,i*3.3+frac*2,t*0.5)*0.15;
      const nm=0.4+sn(frac*5.3+i,frac*4.1+i*2,t*0.55)*0.6;
      const pulse=0.5+0.5*Math.sin(t*0.9+frac*4+i*TAU/3);
      const dr=maxR*nm*(0.4+centrality*0.6);
      const [c,sz,alpha]=colFn(frac,centrality,nm,pulse,breathVal);
      if(alpha<=0)continue;
      const col=`rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
      ctx.fillStyle=col;
      [axisAngle+angleOffset,axisAngle-angleOffset].forEach(ang=>{
        ctx.beginPath();ctx.arc(n.x+Math.cos(ang)*dr,n.y+Math.sin(ang)*dr,sz,0,TAU);ctx.fill();
      });
    }
  }

  function draw(){
    ctx.fillStyle='rgba(14,12,10,0.10)';ctx.fillRect(0,0,W,H);
    t+=0.006;
    const ns=getNodes(cx,cy,t,55);

    for(let i=0;i<3;i++){
      const n=ns[i];
      const axisAngle=Math.atan2(n.y-cy,n.x-cx);
      const innerBreath=eio(0.5+0.5*Math.sin(t*0.7+i*TAU/3));
      const outerBreath=eio(0.5+0.5*Math.sin(t*0.7+i*TAU/3+Math.PI)); // inverted

      // inner wing — amber/ink, dense
      drawLayer(ctx,n,axisAngle,t,i,10+innerBreath*28,0.65,100,innerBreath,
        (frac,cen,nm,pulse,br)=>{
          const c=mc(mc(AMBER,INK,0.3+nm*0.3),BONE,cen*0.3);
          return[c,clamp(0.3+cen*2.2*br*pulse,0.1,3.0),clamp(cen*0.8*(0.2+br*0.8)*pulse,0,0.85)];
        });

      // outer halo — slate/bone, sparse
      drawLayer(ctx,n,axisAngle,t,i,22+outerBreath*36,0.9,80,outerBreath,
        (frac,cen,nm,pulse,br)=>{
          const c=mc(SLATE,mc(BONE,AMBER,nm*0.4),0.3+cen*0.4);
          return[c,clamp(0.2+cen*1.4*br*pulse,0.1,2.0),clamp(cen*0.45*(0.1+br*0.9)*pulse,0,0.5)];
        });
    }
    requestAnimationFrame(draw);
  }
  ctx.fillStyle='#0e0c0a';ctx.fillRect(0,0,W,H);
  draw();
})();

// ---- 04: CONTRACT ----
// The whole system breathes as one unified organism.
// All three arms expand together to maximum, hold briefly,
// then contract to near nothing — almost disappearing —
// then expand again. Like a single breath.
// At full expansion: wide bone/amber wings, very open.
// At contraction: three tight ink spines, barely visible.
// The tri-point structure is starkest at minimum.
;(function(){
  const cv=document.getElementById('d'),ctx=cv.getContext('2d');
  const W=210,H=210,cx=W/2,cy=H/2;
  let t=0;

  function draw(){
    ctx.fillStyle='rgba(14,12,10,0.12)';ctx.fillRect(0,0,W,H);
    t+=0.005;
    const ns=getNodes(cx,cy,t,56);

    // single unified breath — slow, held at extremes
    const raw=Math.sin(t*0.45);
    // bias to spend more time expanded
    const breath=eio(eio(0.5+0.5*raw));

    for(let i=0;i<3;i++){
      const n=ns[i];
      const axisAngle=Math.atan2(n.y-cy,n.x-cx);
      const spread=0.3+breath*0.85;
      const STEPS=130;
      const maxR=4+breath*44;

      for(let d=0;d<STEPS;d++){
        const frac=d/STEPS;
        const centrality=1-Math.abs(frac*2-1);
        const angleOffset=lerp(-spread,spread,frac)
                         +sn(frac*4.3+i,i*2.7+frac,t*0.4)*0.12;
        const nm=0.45+sn(frac*5.7+i*2,frac*3.9+i,t*0.5)*0.55;
        const pulse=0.5+0.5*Math.sin(t*1.3+frac*6+i*TAU/3);
        const dr=maxR*nm*(0.35+centrality*0.65);

        // contracted: pure ink spine
        // expanded: bone outer, amber inner, slate tips
        let c;
        if(breath<0.3){
          c=mc(INK,SLATE,breath*0.5+nm*0.2);
        } else if(centrality>0.6){
          c=mc(mc(AMBER,BONE,breath),INK,0.2+nm*0.15);
        } else {
          c=mc(mc(SLATE,BONE,nm*0.6),AMBER,breath*centrality*0.5);
        }

        const sz=clamp(0.2+centrality*3.0*breath*(0.4+nm*0.6),0.1,3.8);
        const alpha=clamp(centrality*(0.15+breath*0.85)*pulse*0.9,0,0.88);

        const col=`rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
        ctx.fillStyle=col;
        [axisAngle+angleOffset,axisAngle-angleOffset].forEach(ang=>{
          ctx.beginPath();ctx.arc(n.x+Math.cos(ang)*dr,n.y+Math.sin(ang)*dr,sz,0,TAU);ctx.fill();
        });
      }
    }
    requestAnimationFrame(draw);
  }
  ctx.fillStyle='#0e0c0a';ctx.fillRect(0,0,W,H);
  draw();
})();

})();
</script>
